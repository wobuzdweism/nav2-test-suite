name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install Nav2 message dependencies (import-only, no sim)
        run: |
          sudo apt-get update
          sudo apt-get install -y ros-humble-nav2-msgs

      - name: Syntax-level lint (errors & undefined names only)
        run: |
          pip install flake8
          python3 -m flake8 src/nav_test --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Build package
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install

      - name: Collect test cases (import & fixture discovery check)
        shell: bash
        run: |
          set -o pipefail
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          mkdir -p reports
          python3 -m pytest src/nav_test/test --collect-only -q \
            --junitxml=reports/case_inventory.xml 2>&1 | tee reports/collect.log

      - name: Publish test evidence (CD artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.sha }}
          path: |
            reports/
            log/
          retention-days: 14

  docker-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build SUT image (Gazebo headless + Nav2 + test suite)
        run: docker build -t nav2-test-sut .

      - name: Smoke test inside container (imports + collect, no sim start)
        run: |
          set -o pipefail
          mkdir -p reports
          docker run --rm --entrypoint /bin/bash nav2-test-sut -c \
            "source /opt/ros/humble/setup.bash && \
             source /opt/nav_ws/install/setup.bash && \
             python3 -m pytest src/nav_test/test --collect-only -q" \
            2>&1 | tee reports/container_smoke.log

      - name: Publish container smoke report (CD artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-evidence-${{ github.sha }}
          path: reports/
          retention-days: 14
