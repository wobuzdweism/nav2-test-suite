name: CI

on:
  push:
  pull_request:

jobs:
  build-and-collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Syntax-level lint (errors & undefined names only)
        run: |
          pip install flake8
          flake8 src/nav_test --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Build package
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install

      - name: Collect test cases (import & fixture discovery check)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 -m pytest src/nav_test/test --collect-only -q
